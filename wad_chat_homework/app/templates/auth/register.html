{% extends "base.html" %}

{% block title %}Register · wad_chat_homework{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create account</h1>
    <p class="muted">Register with a unique login and password.</p>

    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/register" class="stack-form">
        <label>
            <span>Login</span>
            <input type="text" name="login" value="{{ form.login or '' }}" required minlength="3" maxlength="50">
        </label>
        <label>
            <span>Display name</span>
            <input type="text" name="display_name" value="{{ form.display_name or '' }}" maxlength="100">
        </label>
        <label>
            <span>Password</span>
            <input type="password" name="password" required minlength="6" maxlength="128">
        </label>
        <button type="submit" class="button">Register</button>
    </form>

    <p class="small-text">Already have an account? <a href="/auth/login">Login here</a>.</p>
</section>
{% endblock %}
