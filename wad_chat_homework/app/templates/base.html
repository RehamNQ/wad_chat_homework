<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}wad_chat_homework{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container nav-row">
        <a class="brand" href="/">wad_chat_homework</a>
        <nav class="nav-links">
            {% if current_user %}
                <a href="/chats">My Chats</a>
                <span class="muted">Signed in as {{ current_user.display_name or current_user.login }}</span>
                <form action="/auth/logout" method="post" class="inline-form">
                    <button type="submit" class="button secondary">Logout</button>
                </form>
            {% else %}
                <a href="/auth/login">Login</a>
                <a href="/auth/register">Register</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container page-content">
    {% block content %}{% endblock %}
</main>
</body>
</html>
